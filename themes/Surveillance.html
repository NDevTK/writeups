<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surveillance</title>
    <!-- MapLibre GL JS v6 (vector basemap) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@^6.0.0/dist/maplibre-gl.css" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        overflow: hidden;
        font-family: ui-monospace, 'Consolas', 'Courier New', monospace;
        color: #d7e6f0;
      }
      #map {
        position: fixed;
        inset: 0;
      }
      .maplibregl-canvas {
        outline: none;
      }
      /* Search control */
      .search-ctrl {
        display: none;
        position: relative;
        width: 260px;
      }
      body.controls .search-ctrl {
        display: block;
      }
      .search-ctrl input {
        box-sizing: border-box;
        width: 100%;
        padding: 7px 10px;
        border: 1px solid rgba(120, 200, 255, 0.3);
        border-radius: 4px;
        background: #0b0f14;
        color: #d7e6f0;
        font: inherit;
        font-size: 13px;
        outline: none;
      }
      .search-ctrl input::placeholder { color: #667; }
      .search-ctrl input:focus {
        border-color: rgba(120, 200, 255, 0.6);
      }
      .search-ctrl ul {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        margin: 2px 0 0;
        padding: 0;
        list-style: none;
        background: #0b0f14;
        border: 1px solid rgba(120, 200, 255, 0.3);
        border-radius: 4px;
        max-height: 220px;
        overflow-y: auto;
        z-index: 10;
      }
      .search-ctrl ul.open { display: block; }
      .search-ctrl li {
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .search-ctrl li:hover {
        background: rgba(120, 200, 255, 0.12);
      }
      /* Dark popups for the camera details */
      .maplibregl-popup-content {
        background: #0b0f14;
        color: #d7e6f0;
        border: 1px solid rgba(120, 200, 255, 0.3);
        border-radius: 6px;
        padding: 10px 12px;
      }
      .maplibregl-popup-tip {
        border-top-color: #0b0f14;
      }
      .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
        border-top-color: #0b0f14;
      }
      .maplibregl-popup-anchor-top .maplibregl-popup-tip {
        border-bottom-color: #0b0f14;
      }
      .maplibregl-popup-anchor-left .maplibregl-popup-tip {
        border-right-color: #0b0f14;
      }
      .maplibregl-popup-anchor-right .maplibregl-popup-tip {
        border-left-color: #0b0f14;
      }
      .maplibregl-popup-close-button {
        color: #7fb6d6;
        font-size: 18px;
      }
      .cam b {
        display: block;
        margin-bottom: 4px;
      }
      .cam div {
        margin: 1px 0;
      }
      .cam .k {
        color: #7fb6d6;
      }
      .cam a {
        color: #9be7ff;
      }
      /* Hide the default attribution toggle to keep the map clean */
      .maplibregl-ctrl-attrib {
        background: rgba(11, 15, 20, 0.7) !important;
        color: #667 !important;
        font-size: 10px !important;
      }
      .maplibregl-ctrl-attrib a {
        color: #889 !important;
      }
      /* Legend rides along with the other controls */
      .legend {
        position: fixed;
        left: 10px;
        bottom: 24px;
        z-index: 500;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.6;
        background: rgba(11, 15, 20, 0.85);
        border: 1px solid rgba(120, 200, 255, 0.25);
        display: none;
      }
      body.controls .legend {
        display: block;
      }
      .legend .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 50%;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="legend" aria-hidden="true">
      <div><span class="dot" style="background: #ffd166"></span>Camera</div>
      <div>
        <span class="dot" style="background: #5fd0ff"></span>ALPR (plate reader)
      </div>
      <div><span class="dot" style="background: #9be37d"></span>Guard</div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "maplibre-gl": "https://unpkg.com/maplibre-gl@^6.0.0/dist/maplibre-gl.mjs"
        }
      }
    </script>

    <script type="module">
      import * as maplibregl from 'maplibre-gl';
      'use strict';

      // HTML-escape OSM tag values before they touch a popup.
      function esc(value) {
        return String(value == null ? '' : value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            })[c]
        );
      }

      // Marker colour + label for each kind of surveillance node.
      function kindInfo(tags) {
        const t = (tags['surveillance:type'] || '').toLowerCase();
        if (t === 'alpr' || t === 'anpr')
          return {
            label: 'ALPR camera',
            icon: '🚗',
            color: '#1b9bd8',
            fill: '#5fd0ff'
          };
        if (t === 'guard')
          return {
            label: 'Guard',
            icon: '👮',
            color: '#3fa34d',
            fill: '#9be37d'
          };
        return {
          label: 'Surveillance camera',
          icon: '📷',
          color: '#ff5f5f',
          fill: '#ffd166'
        };
      }

      // Build a popup from whatever tags the node carries (all escaped).
      function popupHtml(node) {
        const tags = node.tags || {};
        const info = kindInfo(tags);
        const rows = [];
        function row(label, value) {
          if (value)
            rows.push(
              '<div><span class="k">' +
                label +
                '</span> ' +
                esc(value) +
                '</div>'
            );
        }
        row('Name', tags.name);
        row('Operator', tags.operator);
        row('Camera', tags['camera:type']);
        row('Mount', tags['camera:mount']);
        const dir = tags['camera:direction'] || tags.direction;
        if (dir) row('Facing', /^-?\d+(\.\d+)?$/.test(dir) ? dir + '°' : dir);
        row('Zone', tags['surveillance:zone'] || tags.surveillance);
        row('Height', tags.height);

        const feed =
          tags['contact:webcam'] || tags.webcam || tags.website || tags.url;
        let extra = '';
        if (feed && /^https?:\/\//i.test(feed))
          extra +=
            '<div><a href="' +
            esc(feed) +
            '" target="_blank" rel="noreferrer noopener">▶ live feed</a></div>';
        extra +=
          '<div><a href="https://www.openstreetmap.org/node/' +
          esc(node.id) +
          '" target="_blank" rel="noreferrer noopener">OSM node ' +
          esc(node.id) +
          '</a></div>';

        return (
          '<div class="cam"><b>' +
          info.icon +
          ' ' +
          esc(info.label) +
          '</b>' +
          rows.join('') +
          extra +
          '</div>'
        );
      }

      // No zoom buttons: they'd sit under the host's ✦ controls toggle, and
      // scroll / double-click / pinch / +- keys still zoom the wallpaper.
      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/dark',
        center: [0, 25],
        zoom: 2,
        attributionControl: true
      });

      // Lightweight Nominatim search control (replaces external geocoder dep).
      class SearchControl {
        onAdd(map) {
          this._map = map;
          const el = (this._container = document.createElement('div'));
          el.className = 'maplibregl-ctrl search-ctrl';
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = 'Search…';
          const list = document.createElement('ul');
          el.append(input, list);

          let debounce;
          input.addEventListener('input', () => {
            clearTimeout(debounce);
            const q = input.value.trim();
            if (!q) {
              list.innerHTML = '';
              list.classList.remove('open');
              return;
            }
            debounce = setTimeout(() => this._search(q, list), 350);
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
              list.innerHTML = '';
              list.classList.remove('open');
              input.blur();
            }
          });
          return el;
        }
        async _search(query, list) {
          try {
            const params = new URLSearchParams({
              q: query,
              format: 'json',
              limit: '5'
            });
            const r = await fetch(
              'https://nominatim.openstreetmap.org/search?' + params,
              {credentials: 'omit'}
            );
            const results = await r.json();
            list.innerHTML = '';
            if (!results.length) {
              list.classList.remove('open');
              return;
            }
            for (const place of results) {
              const li = document.createElement('li');
              li.textContent = place.display_name;
              li.addEventListener('click', () => {
                this._map.flyTo({
                  center: [parseFloat(place.lon), parseFloat(place.lat)],
                  zoom: 16
                });
                list.innerHTML = '';
                list.classList.remove('open');
              });
              list.append(li);
            }
            list.classList.add('open');
          } catch (_) {}
        }
        onRemove() {
          this._container.remove();
          this._map = undefined;
        }
      }
      map.addControl(new SearchControl(), 'top-right');

      // GeoJSON source + layers for surveillance cameras.
      const CAMERA_SOURCE = 'cameras';
      const MIN_ZOOM = 14; // below this the view is too large to query responsibly

      // Keep the raw Overpass elements so we can look up tags on click.
      let cameraElements = [];

      map.on('load', () => {
        map.addSource(CAMERA_SOURCE, {
          type: 'geojson',
          data: {type: 'FeatureCollection', features: []}
        });

        // Circle layer for all cameras.
        map.addLayer({
          id: 'cameras-circle',
          type: 'circle',
          source: CAMERA_SOURCE,
          paint: {
            'circle-radius': 4,
            'circle-color': ['get', 'fill'],
            'circle-stroke-color': ['get', 'color'],
            'circle-stroke-width': 1,
            'circle-opacity': 0.85
          }
        });

        // Pointer cursor on hover over cameras.
        map.on('mouseenter', 'cameras-circle', () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'cameras-circle', () => {
          map.getCanvas().style.cursor = '';
        });

        // Popup on click.
        map.on('click', 'cameras-circle', (e) => {
          const feat = e.features[0];
          const nodeId = feat.properties.nodeId;
          const node = cameraElements.find((n) => n.id === nodeId);
          if (!node) return;
          new maplibregl.Popup({maxWidth: '280px'})
            .setLngLat(e.lngLat)
            .setHTML(popupHtml(node))
            .addTo(map);
        });

        // Fire initial refresh after style is loaded.
        refresh();
      });

      function refresh() {
        if (!map.getSource(CAMERA_SOURCE)) return;
        if (map.getZoom() < MIN_ZOOM) {
          map
            .getSource(CAMERA_SOURCE)
            .setData({type: 'FeatureCollection', features: []});
          cameraElements = [];
          return;
        }
        const b = map.getBounds();
        const query =
          '[out:json][timeout:25];node["man_made"="surveillance"](' +
          b.getSouth() +
          ',' +
          b.getWest() +
          ',' +
          b.getNorth() +
          ',' +
          b.getEast() +
          ');out body 800;';
        fetch(
          'https://maps.mail.ru/osm/tools/overpass/api/interpreter?data=' +
            encodeURIComponent(query),
          {credentials: 'omit'}
        )
          .then((r) => r.json())
          .then((d) => {
            cameraElements = (d.elements || []).filter(
              (n) => n.lat && n.lon
            );
            const features = cameraElements.map((n) => {
              const info = kindInfo(n.tags || {});
              return {
                type: 'Feature',
                geometry: {type: 'Point', coordinates: [n.lon, n.lat]},
                properties: {
                  nodeId: n.id,
                  color: info.color,
                  fill: info.fill
                }
              };
            });
            map
              .getSource(CAMERA_SOURCE)
              .setData({type: 'FeatureCollection', features});
          })
          .catch(() => {});
      }

      let timer;
      map.on('moveend', () => {
        clearTimeout(timer);
        timer = setTimeout(refresh, 600);
      });

      // Open near the visitor (IP-based) as a starting point; search takes over.
      fetch('https://get.geojs.io/v1/ip/geo.json', {credentials: 'omit'})
        .then((r) => r.json())
        .then((g) => {
          const lat = parseFloat(g.latitude);
          const lon = parseFloat(g.longitude);
          if (isFinite(lat) && isFinite(lon))
            map.flyTo({center: [lon, lat], zoom: 16});
          else refresh();
        })
        .catch(() => refresh());

      // ---------- Host bridge (shaderwall protocol) ----------
      let shown = false;
      function setShown(value) {
        shown = value;
        document.body.classList.toggle('controls', value);
        window.parent.postMessage(
          {type: 'shaderwall', state: shown ? 'shown' : 'hidden'},
          location.origin
        );
        setTimeout(() => map.resize(), 60);
      }
      addEventListener('message', (e) => {
        if (e.origin != location.origin) return;
        const d = e.data || {};
        if (d.type !== 'shaderwall') return;
        if (d.action === 'show') setShown(true);
        else if (d.action === 'hide') setShown(false);
        else if (d.action === 'toggle') setShown(!shown);
      });
      addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') setShown(!shown);
      });
      setShown(false);
    </script>
  </body>
</html>
